name: Deploy support site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public files for legacy GitHub Pages
        run: |
          sh scripts/build.sh
          python3 - <<'PYTHON'
          from pathlib import Path
          page = Path("dist/404.html")
          html = page.read_text().replace('href="/assets/', 'href="/RewindCam-support-site/assets/').replace('href="/"', 'href="/RewindCam-support-site/"')
          page.write_text(html)
          PYTHON

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
